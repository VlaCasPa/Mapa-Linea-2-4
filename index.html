<!-- Reemplazar dentro de la sección de filtros -->
<details open class="absolute top-3 left-3 z-[1000] bg-white/95 backdrop-blur-sm p-2.5 border border-slate-200 rounded-lg shadow-sm w-[85%] sm:w-auto max-w-sm">
    <summary class="text-[0.6rem] font-bold text-slate-500 uppercase cursor-pointer list-none flex justify-between items-center [&::-webkit-details-marker]:hidden">Aislamiento de Riesgo ▼</summary>
    <div class="flex flex-wrap gap-1 mt-2 filtro-seccion">
        <button class="btn-pill active" data-estado="Todos">Vista General</button>
        <button class="btn-pill" data-estado="Criticos">🔴 Sin Acción</button>
        <button class="btn-pill" data-estado="Tramite">🟣 En Trámite</button>
        <button class="btn-pill" data-estado="Menor4Meses">🟡 Alerta Preventiva</button>
        <button class="btn-pill" data-estado="Ley31955">🟠 Ley N° 31955</button>
        <button class="btn-pill" data-estado="Culminado">🟢 Culminadas</button>
        <!-- NUEVO BOTÓN MINCUL -->
        <button class="btn-pill border-indigo-200 text-indigo-700 bg-indigo-50 hover:bg-indigo-100" data-estado="Mincul">🏛️ MINCUL</button>
    </div>
</details>

<!-- Reemplazar los THEAD de ambas tablas (Obras y Desvíos) para agregar divisores verticales -->
<thead class="text-slate-700 sticky top-0 z-10 shadow-sm" style="background-color: #b5d7ed;">
    <tr>
        <th class="p-2.5 font-bold uppercase tracking-wider w-16 border-r border-slate-300/40">ID</th>
        <th class="p-2.5 font-bold uppercase tracking-wider border-r border-slate-300/40">Resolución Base</th>
        <th class="p-2.5 font-bold uppercase tracking-wider text-center w-28">Contingencia</th>
    </tr>
</thead>
<!-- Hacer lo mismo para el THEAD de la tabla de Desvíos, usando su color correspondiente -->
<thead class="text-slate-700 sticky top-0 z-10 shadow-sm" style="background-color: #ebd7b3;">
    <tr>
        <th class="p-2.5 font-bold uppercase tracking-wider w-16 border-r border-slate-300/40">ID</th>
        <th class="p-2.5 font-bold uppercase tracking-wider border-r border-slate-300/40">Resolución Base</th>
        <th class="p-2.5 font-bold uppercase tracking-wider text-center w-28">Contingencia</th>
    </tr>
</thead>
